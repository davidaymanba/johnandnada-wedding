# Runs behind the server's Traefik (Docker provider, `letsencrypt` resolver).
# Lives at /docker/johnandnada/ next to app/ (the project) and .env (secrets).
services:
  web:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_SITE_URL: https://johnandnada.codexai.systems
    image: johnandnada-web
    restart: unless-stopped
    env_file: .env
    environment:
      GUESTBOOK_FILE: /data/blessings.json
    volumes:
      - blessings:/data
    labels:
      traefik.enable: "true"
      traefik.http.services.johnandnada.loadbalancer.server.port: "3000"
      traefik.http.routers.johnandnada.rule: Host(`johnandnada.codexai.systems`)
      traefik.http.routers.johnandnada.entrypoints: websecure
      traefik.http.routers.johnandnada.tls.certresolver: letsencrypt
      traefik.http.routers.johnandnada.service: johnandnada
      # www.johnandnada… → johnandnada… (own router, own certificate)
      traefik.http.routers.johnandnada-www.rule: Host(`www.johnandnada.codexai.systems`)
      traefik.http.routers.johnandnada-www.entrypoints: websecure
      traefik.http.routers.johnandnada-www.tls.certresolver: letsencrypt
      traefik.http.routers.johnandnada-www.service: johnandnada
      traefik.http.routers.johnandnada-www.middlewares: johnandnada-www
      traefik.http.middlewares.johnandnada-www.redirectregex.regex: ^https://www\.johnandnada\.codexai\.systems/(.*)
      traefik.http.middlewares.johnandnada-www.redirectregex.replacement: https://johnandnada.codexai.systems/$${1}
      traefik.http.middlewares.johnandnada-www.redirectregex.permanent: "true"

volumes:
  blessings:
