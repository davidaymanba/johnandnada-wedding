name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to the VPS
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::error::Add the DEPLOY_KEY secret (see README)"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "31.97.107.121 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN6TSyZAQgDvjtvzyiOVm4ojD0xkPPUfRpzlWy2yauZJ" > ~/.ssh/known_hosts
          # The key is locked to deploy.sh on the server, so this runs only the deploy.
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes root@31.97.107.121
